name: FridgeNote
options:
  bundleIdPrefix: com.fridgenote
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BigInt:
    url: https://github.com/attaswift/BigInt
    from: 5.3.0
targets:
  FridgeNote:
    type: application
    platform: iOS
    sources:
      - FridgeNote
    dependencies:
      - package: BigInt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fridgenote.app
        INFOPLIST_FILE: FridgeNote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  FridgeNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FridgeNoteTests
    dependencies:
      - target: FridgeNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fridgenote.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FridgeNote:
    build:
      targets:
        FridgeNote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FridgeNoteTests
