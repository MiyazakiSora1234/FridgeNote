name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      # tscとvitestが通っても、esbuildによるLambdaバンドル自体が壊れる変更
      # (循環参照・external指定漏れ等)をマージしてしまわないよう、実際にビルドして確認する。
      - run: npm run build
      - run: npm run package:api
      - run: npm run package:worker
