name: deploy

# インフラ変更は影響範囲が大きく元に戻しにくいため、pushへの自動フックにはせず
# 手動実行(workflow_dispatch)のみをトリガーとする。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true にすると terraform apply まで実行する(falseならplanのみ)"
        required: true
        default: "false"

permissions:
  id-token: write # OIDCでAWSロールを引き受けるために必要
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Build & package Lambda bundles
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run package:api
          npm run package:worker

      # 静的なアクセスキーではなくOIDCでの一時クレデンシャルを使う。
      # 事前にAWS側でGitHub Actions用のIAM OIDC ProviderとRoleを設定しておくこと。
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.apply == 'true' }}
        working-directory: infra
        run: terraform apply -auto-approve tfplan
