name: consistency-check

# backendとiosで別々に定義している「本来共有すべき定数」がズレていないかを検証する。
# (TypeScriptとSwiftでは定数を共有できないため、このスクリプトで機械的にドリフトを検知する)

on:
  pull_request:
    paths:
      - "backend/src/schemas/aiSchemas.ts"
      - "ios/FridgeNote/Support/Constants.swift"
      - "scripts/check-shared-constants.mjs"
      - ".github/workflows/consistency-check.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/schemas/aiSchemas.ts"
      - "ios/FridgeNote/Support/Constants.swift"
      - "scripts/check-shared-constants.mjs"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-shared-constants.mjs
